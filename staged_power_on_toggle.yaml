blueprint:
  name: Staged Power-On via Toggle
  description: >
    Watches a toggle (input_boolean or any switch). When turned ON,
    powers on a list of switches sequentially with a configurable
    delay between each — useful for desk setups, AV stacks, or
    anything with multiple switching power supplies sharing a
    circuit, where simultaneous inrush current can trip a breaker.
    When turned OFF, switches are powered down all at once
    (or in reverse with a delay, configurable).

    Optionally mirrors a manual power-on: if you switch on any one
    of the target switches directly, the toggle is flipped ON for
    you, which cascades the staged power-on to the rest — so the
    whole stack comes up together no matter which switch you touch.
  domain: automation
  source_url: https://github.com/vplme/ha-blueprints/blob/main/staged_power_on_toggle.yaml
  input:
    toggle:
      name: Toggle entity
      description: >
        The entity that triggers the sequence. Typically an
        input_boolean helper, but any on/off entity works.
      selector:
        entity:
          domain:
            - input_boolean
            - switch
    targets:
      name: Switches to control
      description: >
        Switches will be turned ON in the order listed.
        Put the most important device (e.g. dock) first.
      selector:
        entity:
          domain: switch
          multiple: true
    stagger_delay_on:
      name: Delay between switches (on)
      description: Seconds to wait between turning on each switch.
      default: 1
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: seconds
          mode: slider
    off_behavior:
      name: Power-off behavior
      description: >
        How to turn switches off. "All at once" is fine for most
        setups. "Reverse staged" mirrors the on-sequence in reverse,
        useful if downstream devices need graceful shutdown order.
      default: all_at_once
      selector:
        select:
          options:
            - label: All at once
              value: all_at_once
            - label: Reverse staged
              value: reverse_staged
    stagger_delay_off:
      name: Delay between switches (off, reverse staged only)
      description: >
        Only used if "Reverse staged" is selected above.
      default: 1
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: seconds
          mode: slider
    mirror_manual_on:
      name: Mirror manual power-on
      description: >
        When enabled, switching on any one of the target switches
        directly (while the toggle is off) flips the toggle ON,
        which cascades the staged power-on to the rest. Leave off
        if you only ever drive the stack from the toggle.
      default: false
      selector:
        boolean:

# queued (not restart) so a manual-on mirror can't cancel an
# in-progress staged power-on/off mid-sequence.
mode: queued
max_exceeded: silent

trigger_variables:
  toggle: !input toggle
  targets: !input targets

variables:
  toggle: !input toggle
  targets: !input targets
  off_behavior: !input off_behavior
  mirror_manual_on: !input mirror_manual_on

trigger:
  - platform: state
    entity_id: !input toggle
    to: "on"
    id: turn_on
  - platform: state
    entity_id: !input toggle
    to: "off"
    id: turn_off
  # A target was switched on directly while the toggle is off —
  # i.e. a manual power-on. (Stays false while the toggle is on, so
  # it never fires during our own staging.)
  - platform: template
    id: manual_on
    value_template: >
      {{ is_state(toggle, 'off')
         and (targets | select('is_state', 'on') | list | length > 0) }}

action:
  - choose:
      # Mirror a manual power-on: flip the toggle on, which cascades
      # the staged power-on to the rest of the targets. The toggle
      # last_changed guard ignores stale events queued during a
      # power-off (toggle just flipped) so we don't fight a shutdown.
      - conditions:
          - condition: trigger
            id: manual_on
          - condition: template
            value_template: "{{ mirror_manual_on }}"
          - condition: template
            value_template: >
              {{ is_state(toggle, 'off')
                 and states[toggle] is not none
                 and (now() - states[toggle].last_changed).total_seconds() > 5 }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input toggle
      - conditions:
          - condition: trigger
            id: turn_on
        sequence:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                - delay:
                    seconds: !input stagger_delay_on
      - conditions:
          - condition: trigger
            id: turn_off
        sequence:
          - choose:
              - conditions:
                  - "{{ off_behavior == 'reverse_staged' }}"
                sequence:
                  - repeat:
                      for_each: "{{ targets | reverse | list }}"
                      sequence:
                        - action: switch.turn_off
                          target:
                            entity_id: "{{ repeat.item }}"
                        - delay:
                            seconds: !input stagger_delay_off
            default:
              - action: switch.turn_off
                target:
                  entity_id: "{{ targets }}"
